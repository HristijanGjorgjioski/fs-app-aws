name: Deploy to EC2

on:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Open SSH for this runner
        id: ip
        run: |
          IP=$(curl -s https://checkip.amazonaws.com)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ vars.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "$IP/32"

      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ vars.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} 'bash ~/app/deploy.sh'

      - name: Close SSH
        if: always() && steps.ip.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ vars.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${{ steps.ip.outputs.ip }}/32"